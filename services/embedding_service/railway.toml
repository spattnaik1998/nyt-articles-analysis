[build]
builder = "dockerfile"
dockerfilePath = "services/embedding_service/Dockerfile"

[deploy]
startCommand = "uvicorn services.embedding_service.main:app --host 0.0.0.0 --port 8001"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
